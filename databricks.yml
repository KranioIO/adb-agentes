bundle:
  name: projet-demo

variables:
  target_catalog:
    default: main_dev

sync:
  include:
    - ./volume/**

resources:
  # 1. Création du Volume dans Unity Catalog
  volumes:
    mon_volume_entree:
      name: mon_volume_entree
      catalog_name: ${var.target_catalog}
      schema_name: default

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-1194260751860413.13.azuredatabricks.net
      root_path: /Shared/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: "a963eeab-b3eb-44fc-87c5-8365bf6a0a42"

  qa:   
    mode: production
    workspace:
      host: https://adb-1832665218446849.9.azuredatabricks.net
      root_path: /Shared/${bundle.name}/${bundle.target}
    variables:
      target_catalog: main_qa
      target_volume: mon_volume_entree


