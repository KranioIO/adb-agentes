name: CI/CD Databricks Alerts Professional Flow

on:
  push:
    branches:
      - development
      - release
      - main

jobs:
  # --- JOB 1: EXTRAER DESDE DEV (Solo si estamos en la rama development) ---
  extract:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Extract from DEV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          rm -rf alerts_code/
          mkdir -p alerts_code/
          for id in $(databricks alerts-v2 list-alerts -o json | jq -r '.[] | .id'); do
            databricks alerts-v2 get-alert "$id" -o json > "alerts_code/alert_$id.json"
          done

      - name: Commit & Push Alerts to Git
        run: |
          git config --global user.name "Service Principal"
          git config --global user.email "sp@databricks.com"
          
          # CAMBIO AQUÍ: Usar -A para capturar los borrados
          git add -A alerts_code/
          
          # Usamos un if para evitar errores si no hay absolutamente ningún cambio
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: Sync alerts from DEV (including deletions) [skip ci]"
            git push
          fi

  # --- JOB 2: DESPLEGAR (A QA o PRD según la rama) ---
  deploy:
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main'
    needs: [] # No necesita el job de extract porque lee los archivos ya commiteados en la rama
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prd' || 'qa' }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Target Environment
        env:
          DATABRICKS_HOST: ${{ github.ref == 'refs/heads/main' && secrets.DATABRICKS_HOST_PRD || secrets.DATABRICKS_HOST_QA }}
          DATABRICKS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.DATABRICKS_TOKEN_PRD || secrets.DATABRICKS_TOKEN_QA }}
          TARGET_WH: ${{ vars.WAREHOUSE_ID }}
          TARGET_PATH: ${{ vars.ALERTS_PATH }}
          TARGET_CATALOG: ${{ vars.CATALOG_NAME }}
          SOURCE_CATALOG: "main_dev" # Siempre es nuestra base en el código
          DEFAULT_COLUMN: "cnt"
        run: |
          # Solo procesamos si la carpeta existe
          run: |
          if [ ! -d "alerts_code" ]; then echo "No alerts to deploy"; exit 0; fi
          
          for file in alerts_code/*.json; do
            NAME=$(jq -r '.display_name' "$file")
            echo "🔍 Procesando: $NAME"
          
            # 1. Metadatos
            CRON=$(jq -r '.schedule.quartz_cron_schedule // ""' "$file")
            TZ=$(jq -r '.schedule.timezone_id // "UTC"' "$file")
            RAW_QUERY=$(jq -r '.query_text // ""' "$file")
          
            # 2. Extracción de Columna
            FALLBACK_COL=$(echo "$RAW_QUERY" | tr -d '\n' | grep -iP -o '(\w+)(?=\s+FROM)' | tail -n 1)
            
            if [ -z "$FALLBACK_COL" ]; then
                FALLBACK_COL=$(echo "$RAW_QUERY" | tr -d '\n' | grep -iP -o 'SELECT\s+\K\w+' | head -n 1)
            fi
          
            if [ -z "$FALLBACK_COL" ] || [ "$FALLBACK_COL" == "*" ]; then
                FALLBACK_COL="$DEFAULT_COLUMN" 
            fi
            
            echo "📊 Columna detectada: $FALLBACK_COL"
          
            # 3. Transformación de Query y Construcción Base
            # Extraemos la query, aplicamos el cambio de catálogo y la limpiamos
            FINAL_QUERY=$(jq -r '.query_text' "$file" | sed "s/$SOURCE_CATALOG/$TARGET_CATALOG/g")
            
            # Si por algún motivo la query queda vacía, la rescatamos del archivo original directamente
            if [ -z "$FINAL_QUERY" ] || [ "$FINAL_QUERY" == "null" ]; then
                FINAL_QUERY=$(jq -r '.query_text' "$file")
            fi

            jq -n \
               --arg NAME "$NAME" \
               --arg QUERY "$FINAL_QUERY" \
               --arg WH "$TARGET_WH" \
               --arg PATH "$TARGET_PATH" \
               --arg OP "$(jq -r '.evaluation.comparison_operator' "$file")" \
               --arg COL "$FALLBACK_COL" \
               --argjson ORIG_THRESH "$(jq '.evaluation.threshold' "$file")" \
            '
            {
              "display_name": $NAME,
              "query_text": $QUERY,
              "warehouse_id": $WH,
              "parent_path": $PATH,
              "evaluation": {
                "comparison_operator": $OP,
                "source": { "name": $COL },
                "threshold": {
                  "value": (
                    if $ORIG_THRESH.value.double_value != null then { "double_value": ($ORIG_THRESH.value.double_value | tonumber) }
                    elif $ORIG_THRESH.value.string_value != null then { "string_value": $ORIG_THRESH.value.string_value }
                    else { "double_value": 0 }
                    end
                  )
                }
              }
            }' > payload.json
          
            # 4. Horario
            if [ ! -z "$CRON" ] && [ "$CRON" != "null" ] && [ "$CRON" != "" ]; then
              echo "⏰ Añadiendo horario: $CRON"
              jq --arg CRON "$CRON" --arg TZ "$TZ" \
                '. + { "schedule": { "quartz_cron_schedule": $CRON, "timezone_id": $TZ, "pause_status": "PAUSED" } }' \
                payload.json > temp_payload.json && mv temp_payload.json payload.json
            fi
          
            # 5. Sincronización (Create/Update)
            EXISTING_ID=$(databricks alerts-v2 list-alerts -o json | jq -r --arg NAME "$NAME" '.[] | select(.display_name == $NAME) | .id' | head -n 1)
        
            if [ -z "$EXISTING_ID" ] || [ "$EXISTING_ID" == "null" ]; then
              echo "🆕 Creando alerta..."
              databricks alerts-v2 create-alert --json @payload.json
            else
              echo "🔄 Actualizando alerta ID: $EXISTING_ID"
              jq 'del(.parent_path)' payload.json > update_payload.json
              databricks alerts-v2 update-alert "$EXISTING_ID" "display_name,query_text,warehouse_id,evaluation,schedule" --json @update_payload.json
            fi
          done