name: CI/CD Databricks Alerts Professional Flow

on:
  push:
    branches:
      - development
      - release
      - main

jobs:
  # --- JOB 1: EXTRAER DESDE DEV (Solo si estamos en la rama development) ---
  extract:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Extract from DEV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          rm -rf alerts_code/
          mkdir -p alerts_code/
          for id in $(databricks alerts-v2 list-alerts -o json | jq -r '.[] | .id'); do
            databricks alerts-v2 get-alert "$id" -o json > "alerts_code/alert_$id.json"
          done

      - name: Commit & Push Alerts to Git
        run: |
          git config --global user.name "Service Principal"
          git config --global user.email "sp@databricks.com"
          
          # CAMBIO AQUÍ: Usar -A para capturar los borrados
          git add -A alerts_code/
          
          # Usamos un if para evitar errores si no hay absolutamente ningún cambio
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: Sync alerts from DEV (including deletions) [skip ci]"
            git push
          fi

  # --- JOB 2: DESPLEGAR (A QA o PRD según la rama) ---
  deploy:
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main'
    needs: [] # No necesita el job de extract porque lee los archivos ya commiteados en la rama
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prd' || 'qa' }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Target Environment
        env:
          DATABRICKS_HOST: ${{ github.ref == 'refs/heads/main' && secrets.DATABRICKS_HOST_PRD || secrets.DATABRICKS_HOST_QA }}
          DATABRICKS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.DATABRICKS_TOKEN_PRD || secrets.DATABRICKS_TOKEN_QA }}
          TARGET_WH: ${{ vars.WAREHOUSE_ID }}
          TARGET_PATH: ${{ vars.ALERTS_PATH }}
          TARGET_CATALOG: ${{ vars.CATALOG_NAME }}
          SOURCE_CATALOG: "main_dev" # Siempre es nuestra base en el código
          DEFAULT_COLUMN: "cnt"
        run: |
          if [ ! -d "alerts_code" ]; then echo "No alerts to deploy"; exit 0; fi
          
          for file in alerts_code/*.json; do
            NAME=$(jq -r '.display_name' "$file")
            echo "🔍 Analizando: $NAME"
        
            # 1. Limpieza con manejo explícito de threshold
            jq --arg WH "$TARGET_WH" \
               --arg PATH "$TARGET_PATH" \
               --arg DEF_COL "$DEFAULT_COLUMN" \
               --arg S_CAT "$SOURCE_CATALOG" \
               --arg T_CAT "$TARGET_CATALOG" '
        
            # Construir threshold de forma segura
            def safe_threshold:
              if .comparison_operator == "IS_NULL" or .comparison_operator == "IS_NOT_NULL"
              then null
              elif .threshold.value != null
              then { "value": (.threshold.value | with_entries(select(.value != null))) }
              elif .threshold.column != null
              then { "column": (.threshold.column | with_entries(select(.value != null))) }
              else null
              end;
        
            {
              "display_name": .display_name,
              "query_text": ((.query_text // "") | gsub($S_CAT; $T_CAT)),
              "warehouse_id": $WH,
              "parent_path": $PATH,
              "evaluation": (
                .evaluation | {
                  "comparison_operator": .comparison_operator,
                  "source": {
                    "name": (if .source.name == null or .source.name == ""
                             then $DEF_COL
                             else .source.name end)
                  }
                }
                + (safe_threshold as $th |
                   if $th != null then { "threshold": $th } else {} end)
                + (if .notification != null
                   then { "notification": .notification }
                   else {} end)
              ),
              "schedule": (
                if .schedule.quartz_cron_schedule != null and
                   .schedule.quartz_cron_schedule != ""
                then .schedule
                else null end
              )
            }
            | with_entries(select(.value != null))
            ' "$file" > payload_limpio.json
        
            echo "📋 Payload generado:"
            cat payload_limpio.json
        
            # 2. Verificar existencia
            EXISTING_ID=$(databricks alerts-v2 list-alerts -o json \
              | jq -r --arg NAME "$NAME" '.[] | select(.display_name == $NAME) | .id' \
              | head -n 1)
            
            if [ -z "$EXISTING_ID" ] || [ "$EXISTING_ID" == "null" ]; then
              echo "🆕 Modo CREACIÓN"
              databricks alerts-v2 create-alert --json @payload_limpio.json
            else
              echo "🔄 Modo ACTUALIZACIÓN (ID: $EXISTING_ID)"
              jq 'del(.parent_path)' payload_limpio.json > payload_update.json
              
              MASK="display_name,query_text,warehouse_id,evaluation,schedule"
              databricks alerts-v2 update-alert "$EXISTING_ID" "$MASK" --json @payload_update.json
            fi
          done
