name: CI/CD Databricks Alerts Professional Flow

on:
  push:
    branches:
      - development
      - release
      - main

jobs:
  # --- JOB 1: EXTRAER DESDE DEV (Solo si estamos en la rama development) ---
  extract:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Extract from DEV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          rm -rf alerts_code/
          mkdir -p alerts_code/
          for id in $(databricks alerts-v2 list-alerts -o json | jq -r '.[] | .id'); do
            databricks alerts-v2 get-alert "$id" -o json > "alerts_code/alert_$id.json"
          done

      - name: Commit & Push Alerts to Git
        run: |
          git config --global user.name "Service Principal"
          git config --global user.email "sp@databricks.com"
          
          # CAMBIO AQUÍ: Usar -A para capturar los borrados
          git add -A alerts_code/
          
          # Usamos un if para evitar errores si no hay absolutamente ningún cambio
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: Sync alerts from DEV (including deletions) [skip ci]"
            git push
          fi

  # --- JOB 2: DESPLEGAR (A QA o PRD según la rama) ---
  deploy:
    if: github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main'
    needs: [] # No necesita el job de extract porque lee los archivos ya commiteados en la rama
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prd' || 'qa' }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Target Environment
        env:
          DATABRICKS_HOST: ${{ github.ref == 'refs/heads/main' && secrets.DATABRICKS_HOST_PRD || secrets.DATABRICKS_HOST_QA }}
          DATABRICKS_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.DATABRICKS_TOKEN_PRD || secrets.DATABRICKS_TOKEN_QA }}
          TARGET_WH: ${{ vars.WAREHOUSE_ID }}
          TARGET_PATH: ${{ vars.ALERTS_PATH }}
          TARGET_CATALOG: ${{ vars.CATALOG_NAME }}
          SOURCE_CATALOG: "main_dev" # Siempre es nuestra base en el código
          DEFAULT_COLUMN: "cnt"
        run: |
          if [ ! -d "alerts_code" ]; then echo "No alerts to deploy"; exit 0; fi
          
          for file in alerts_code/*.json; do
            NAME=$(jq -r '.display_name' "$file")
            echo "-------------------------------------------------------"
            echo "🔍 PROCESANDO: $NAME"
          
            # 1. Extracción de datos con valores por defecto
            CRON=$(jq -r '.schedule.quartz_cron_schedule // empty' "$file")
            TZ=$(jq -r '.schedule.timezone_id // "UTC"' "$file")
            RAW_QUERY=$(jq -r '.query_text // empty' "$file")
            
            # 2. Fallback de columna
            FALLBACK_COL=$(echo "$RAW_QUERY" | tr -d '\n' | grep -iP -o '(\w+)(?=\s+FROM)' | tail -n 1)
            [ -z "$FALLBACK_COL" ] && FALLBACK_COL="$DEFAULT_COLUMN"

            # 3. Construcción del Payload
            jq --arg WH "$TARGET_WH" --arg PATH "$TARGET_PATH" --arg S_CAT "$SOURCE_CATALOG" --arg T_CAT "$TARGET_CATALOG" --arg COL "$FALLBACK_COL" '
            {
              "display_name": .display_name,
              "query_text": (.query_text | gsub($S_CAT; $T_CAT)), 
              "warehouse_id": $WH,
              "parent_path": $PATH,
              "evaluation": {
                "comparison_operator": .evaluation.comparison_operator,
                "source": { "name": (if .evaluation.source.name == null or .evaluation.source.name == "" then $COL else .evaluation.source.name end) },
                "threshold": {
                  "value": (
                    if .evaluation.threshold.value.double_value != null then { "double_value": (.evaluation.threshold.value.double_value | tonumber) }
                    elif .evaluation.threshold.value.string_value != null then { "string_value": .evaluation.threshold.value.string_value }
                    else { "double_value": 0 }
                    end
                  )
                }
              }
            }' "$file" > payload.json

            # 4. Inyección de Schedule (Seguro)
            if [ ! -z "$CRON" ] && [ "$CRON" != "null" ]; then
              jq --arg CRON "$CRON" --arg TZ "$TZ" '. + { "schedule": { "quartz_cron_schedule": $CRON, "timezone_id": $TZ, "pause_status": "PAUSED" } }' payload.json > temp.json && mv temp.json payload.json
            fi

            # 5. ESTRATEGIA: Borrado y Creación (Para evitar conflictos de permisos/updates)
            EXISTING_ID=$(databricks alerts-v2 list-alerts -o json | jq -r --arg NAME "$NAME" '.[] | select(.display_name == $NAME) | .id' | head -n 1)
        
            if [ ! -z "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
              echo "🗑️ Alerta existente detectada (ID: $EXISTING_ID). Borrando para recrear..."
              databricks alerts-v2 delete-alert "$EXISTING_ID" || echo "⚠️ No se pudo borrar, intentando continuar..."
            fi

            echo "🆕 Creando alerta: $NAME"
            # Usamos el payload completo (incluyendo parent_path)
            databricks alerts-v2 create-alert --json @payload.json || { 
              echo "❌ FALLO CRÍTICO: La API rechazó la creación."
              cat payload.json
              exit 1 
            }
            echo "✅ $NAME desplegada con éxito."
          done