name: CI/CD Databricks Alerts

on:
  push:
    branches: development

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Extraer Alertas de DEV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
        run: |
          echo "Conectando a DEV..."
          databricks auth describe
          mkdir -p temp_alerts
          
          # Listar y descargar cada alerta individualmente
          for id in $(databricks alerts-v2 list-alerts -o json | jq -r '.[] | .id'); do
            echo "Descargando alerta ID: $id"
            databricks alerts-v2 get-alert "$id" -o json > "temp_alerts/alert_$id.json"
          done

      - name: Desplegar Alertas en QA
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_QA }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_QA }}
        run: |
          # Configuraciones de destino en QA
          QA_WH="af6acdfdf7d45afd"
          QA_PATH="/Shared/Alerts"
          DEFAULT_COLUMN="value" # Columna por defecto si source.name viene vacío

          for file in temp_alerts/*.json; do
            NAME=$(jq -r '.display_name' "$file")
            echo "------------------------------------------------------"
            echo "🔍 Procesando alerta: $NAME"
            
            # 1. PRE-PROCESAMIENTO: Extraer columna del SQL si source.name es nulo/vacío
            # Intentamos sacar la última palabra antes del FROM en el SQL
            QUERY_TEXT=$(jq -r '.query_text' "$file")
            FALLBACK_COL=$(echo "$QUERY_TEXT" | grep -iP -o '(\w+)(?=\s+FROM)' | tail -n 1 || echo "$DEFAULT_COLUMN")

            # 2. BUSCAR SI YA EXISTE EN QA (por nombre)
            EXISTING_ID=$(databricks alerts-v2 list-alerts -o json | jq -r --arg NAME "$NAME" '.[] | select(.display_name == $NAME) | .id' | head -n 1)

            if [ -z "$EXISTING_ID" ] || [ "$EXISTING_ID" == "null" ]; then
              echo "🆕 Estado: No existe en QA. Iniciando MODO CREACIÓN..."
              
              # Transformación para CREAR (incluye parent_path)
              jq --arg WH "$QA_WH" --arg PATH "$QA_PATH" --arg FALLBACK "$FALLBACK_COL" '
                del(.id, .create_time, .update_time, .owner_user_name, .effective_run_as, .evaluation.state, .evaluation.last_evaluated_at) | 
                .warehouse_id = (if .warehouse_id == "" or .warehouse_id == null then $WH else .warehouse_id end) | 
                .parent_path = $PATH |
                .query_text |= gsub("main_dev"; "main_qa") |
                .evaluation.source.name |= (select(. != null and . != "") // $FALLBACK)
              ' "$file" > payload.json
              
              databricks alerts-v2 create-alert --json @payload.json
            else
              echo "🔄 Estado: Alerta encontrada (ID: $EXISTING_ID). Iniciando MODO ACTUALIZACIÓN..."
              
              # Transformación para ACTUALIZAR (prohibido enviar parent_path)
              jq --arg WH "$QA_WH" --arg FALLBACK "$FALLBACK_COL" '
                del(.id, .create_time, .update_time, .owner_user_name, .effective_run_as, .evaluation.state, .evaluation.last_evaluated_at, .parent_path) | 
                .warehouse_id = (if .warehouse_id == "" or .warehouse_id == null then $WH else .warehouse_id end) | 
                .query_text |= gsub("main_dev"; "main_qa") |
                .evaluation.source.name |= (select(. != null and . != "") // $FALLBACK)
              ' "$file" > payload.json
              
              # Definir la máscara de campos a actualizar
              MASK="display_name,query_text,warehouse_id,evaluation,schedule"
              databricks alerts-v2 update-alert "$EXISTING_ID" "$MASK" --json @payload.json
            fi
          done