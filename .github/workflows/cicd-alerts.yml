name: CI/CD Databricks Alerts

on:
  push:
    branches: development

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Extract from DEV
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_DEV }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
          #DATABRICKS_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID_DEV }}
          #DATABRICKS_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET_DEV }}
          #DATABRICKS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

        run: |
          databricks auth describe
          mkdir -p temp_alerts
          # Extraemos todas las alertas de DEV
          for id in $(databricks alerts-v2 list-alerts -o json | jq -r '.[] | .id'); do
            databricks alerts-v2 get-alert "$id" -o json > "temp_alerts/alert_$id.json"
          done

      # --- PASO 2: DESPLEGAR EN QA ---
      - name: Deploy to QA
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST_QA }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_QA }}
          #DATABRICKS_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID_DEV }}
          #DATABRICKS_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET_DEV }}
          #DATABRICKS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          #DATABRICKS_AUTH_TYPE: azure-client-secret
        run: |
          QA_WH="af6acdfdf7d45afd"
          QA_PATH="/Shared/Alerts" # Destination souhaitée pour les nouvelles alertes
        
          for file in alerts_code/*.json; do
            NAME=$(jq -r '.display_name' "$file")
            echo "🔍 Analizando: $NAME"

            # --- PASO A: Limpieza inicial (Esta es tu base sólida) ---
            # Aquí arreglamos el source.name y el schedule vacío
            jq --arg WH "$QA_WH" --arg PATH "$QA_PATH" --arg DEF_COL "$DEFAULT_COLUMN" '
            {
              "display_name": .display_name,
              "query_text": (.query_text | gsub("main_dev"; "main_qa") // ""), 
              "warehouse_id": $WH,
              "parent_path": $PATH,
              "evaluation": {
                "comparison_operator": .evaluation.comparison_operator,
                "threshold": .evaluation.threshold,
                "source": {
                  "name": (if .evaluation.source.name == null or .evaluation.source.name == "" then $DEF_COL else .evaluation.source.name end)
                }
              },
              # Solo incluimos schedule si tiene un cron válido
              "schedule": (if .schedule.quartz_cron_schedule != null and .schedule.quartz_cron_schedule != "" then .schedule else null end)
            } | del(.. | nulls)
            ' "$file" > payload_limpio.json

            # --- PASO B: Decidir si Crear o Actualizar usando el JSON LIMPIO ---
            EXISTING_ID=$(databricks alerts-v2 list-alerts -o json | jq -r --arg NAME "$NAME" '.[] | select(.display_name == $NAME) | .id' | head -n 1)
        
            if [ -z "$EXISTING_ID" ] || [ "$EXISTING_ID" == "null" ]; then
              echo "🆕 Modo CREACIÓN"
              # USAMOS payload_limpio.json directamente
              databricks alerts-v2 create-alert --json @payload_limpio.json
            else
              echo "🔄 Modo ACTUALIZACIÓN (ID: $EXISTING_ID)"
              # Quitamos el parent_path del payload_limpio porque no se puede actualizar
              jq 'del(.parent_path)' payload_limpio.json > payload_update.json
              
              MASK="display_name,query_text,warehouse_id,evaluation,schedule"
              databricks alerts-v2 update-alert "$EXISTING_ID" "$MASK" --json @payload_update.json
            fi
          done
          