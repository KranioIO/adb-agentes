name: Deploy to QA

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh


      - name: Transfer via Transit (Isolated)
        run: |
          mkdir -p /tmp/databricks_transit
          
          echo "--- Downloading from PRD ---"
          cd /tmp && \
          ARM_CLIENT_ID=${{ env.PRD_CLIENT_ID }} \
          ARM_CLIENT_SECRET=${{ env.PRD_CLIENT_SECRET }} \
          ARM_TENANT_ID=${{ env.PRD_TENANT_ID }} \
          DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST_PRD }} \
          databricks fs cp -r dbfs:/Volumes/catalog_prd/schema/vol ./databricks_transit
          
          echo "--- Uploading to DEV ---"
          cd /tmp && \
          ARM_CLIENT_ID=${{ env.DEV_CLIENT_ID }} \
          ARM_CLIENT_SECRET=${{ env.DEV_CLIENT_SECRET }} \
          ARM_TENANT_ID=${{ env.DEV_TENANT_ID }} \
          DATABRICKS_HOST=${{ secrets.DATABRICKS_HOST_DEV }} \
          databricks fs cp -r ./databricks_transit dbfs:/Volumes/catalog_dev/schema/vol --overwrite
          
          # Limpieza
          rm -rf /tmp/databricks_transit