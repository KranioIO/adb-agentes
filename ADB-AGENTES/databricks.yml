bundle:
  name: alertas-cicd-bundle
 
resources:
  alerts:
    alert_1:
      display_name: "Alert 1"
      query_text: "SELECT count(*) AS cnt FROM main_dev.default.ma_table_scores WHERE value < 50"
      evaluation:
        comparison_operator: "GREATER_THAN"
        source:
          name: "cnt"           # must match a column alias from query_text
        threshold:
          value:
            double_value: 1
      schedule:
        quartz_cron_schedule: "0 0 */1 * * ?"   # every hour — adjust as needed
        timezone_id: "America/Mexico_City"
      warehouse_id: "af6acdfdf7d45afd"    # replace with actual ID
 
targets:
  dev:
    workspace:
      host: https://adb-1194260751860413.13.azuredatabricks.net/